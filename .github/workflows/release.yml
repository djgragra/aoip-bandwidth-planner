name: Release

# Start from the Actions tab (or from a chat) with the version to publish, for example 2026.10.1.
# GitHub creates the tag v<version> on the tip of main and publishes the release. The site copies
# the app from that tag. Nothing is built: the app is plain static files.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to publish (the one in app.js and sw.js, for example 2026.10.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version matches the code, is new and is higher than the latest tag
        env:
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::A release must run on main (this run is on $GITHUB_REF_NAME)"; exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^20[0-9]{2}\.[0-9]{1,2}\.[0-9]+$'; then
            echo "::error::Version $VERSION is not year.month.number (for example 2026.10.1)"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists: use a higher version"; exit 1
          fi
          APP=$(sed -n 's/.*var VERSION = "\([^"]*\)".*/\1/p' app.js)
          SW=$(sed -n 's/.*const CACHE_VERSION = "v\([^"]*\)".*/\1/p' sw.js)
          echo "release: $VERSION  app.js: $APP  sw.js: $SW"
          if [ "$APP" != "$VERSION" ] || [ "$SW" != "$VERSION" ]; then
            echo "::error::VERSION in app.js ($APP) and CACHE_VERSION in sw.js ($SW) must both be $VERSION"; exit 1
          fi
          LATEST=$(git tag --list 'v20*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
          echo "latest tag: ${LATEST:-none}"
          if [ -n "$LATEST" ]; then
            node -e '
              const p = (v) => v.split(".").map((n) => parseInt(n, 10) || 0);
              const [a, b] = [p(process.argv[1]), p(process.argv[2])];
              for (let i = 0; i < Math.max(a.length, b.length); i++) {
                const d = (a[i] || 0) - (b[i] || 0);
                if (d) process.exit(d > 0 ? 0 : 1);
              }
              process.exit(1);
            ' "$VERSION" "$LATEST" || { echo "::error::Version $VERSION must be greater than the latest tag $LATEST"; exit 1; }
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Tests
        run: node --test dev/*.test.js

      - name: Publish the release (creates the tag on main)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.release_version }}
          target_commitish: ${{ github.sha }}
          name: AoIP Bandwidth Planner ${{ github.event.inputs.release_version }}
          body: |
            AoIP Bandwidth Planner ${{ github.event.inputs.release_version }}. Free web app, nothing to install: https://onairgarage.com/tools/aoip-bandwidth-planner/
          make_latest: true
